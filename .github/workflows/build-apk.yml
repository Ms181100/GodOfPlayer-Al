name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android build ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d source

      - name: Find web project
        run: |
          find source -name "index.html" -print

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Capacitor project
        run: |
          mkdir -p app/web

          INDEX=$(find source -name "index.html" | head -n 1)
          ROOT=$(dirname "$INDEX")

          cp -r "$ROOT"/. app/web/

          cd app

          npm init -y

          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.godofplayer.ai",
            "appName": "GodOfPlayer AI",
            "webDir": "web"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodOfPlayer-AI-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
