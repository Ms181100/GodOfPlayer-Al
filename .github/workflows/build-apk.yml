name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        continue-on-error: true

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Android build ZIP
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d source

          echo "Projektinhalt:"
          find source -maxdepth 3 -type f | head -100

      - name: Find web project
        id: web_project
        shell: bash
        run: |
          set -e

          INDEX_FILE
