
name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android build ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "ZIP gefunden: $ZIP"

          unzip -q "$ZIP" -d source

      - name: Find web project
        shell: bash
        run: |
          set -e

          INDEX=$(find source -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html wurde nicht gefunden."
            find source -maxdepth 5 -type f
            exit 1
          fi

          echo "index.html gefunden: $INDEX"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show versions
        shell: bash
        run: |
          node --version
          npm --version
          java -version

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -e

          mkdir -p app/web

          INDEX=$(find source -name "index.html" -print -quit)
          ROOT=$(dirname "$INDEX")

          echo "Web-Projekt: $ROOT"

          cp -r "$ROOT"/. app/web/

          cd app

          npm init -y

          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          cat > capacitor.config.json <<'EOF'
{
  "appId": "com.godofplayer.ai",
  "appName": "GodOfPlayer AI",
  "webDir": "web"
}
EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK wurde nicht erstellt."
            find app/android -name "*.apk" -print
            exit 1
          fi

          echo "APK erfolgreich erstellt:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodOfPlayer-AI-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
