name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android build ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "FEHLER: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP"

          unzip -q "$ZIP" -d source

          echo "ZIP erfolgreich entpackt."

      - name: Find web project
        shell: bash
        run: |
          set -e

          echo "Suche index.html..."

          find source -name "index.html" -print

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Capacitor project
        shell: bash
        run: |
          set -e

          mkdir -p app/web

          INDEX=$(find source -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "FEHLER: Keine index.html gefunden."
            exit 1
          fi

          ROOT=$(dirname "$INDEX")

          echo "Web-Projekt gefunden: $ROOT"

          cp -r "$ROOT"/. app/web/

          cd app

          npm init -y

          npm install \
            @capacitor/core@latest \
            @capacitor/cli@latest \
            @capacitor/android@latest

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.godofplayer.ai",
            "appName": "GodOfPlayer AI",
            "webDir": "web"
          }
          EOF

          echo "Capacitor Android Projekt wird erstellt..."

          npx cap add android

          npx cap sync android

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          ./gradlew assembleDebug

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "FEHLER: APK wurde nicht gefunden."
            exit 1
          fi

          echo "APK erfolgreich erstellt:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodOfPlayer-AI-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
