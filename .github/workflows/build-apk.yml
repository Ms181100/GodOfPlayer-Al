
name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android build ZIP
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Keine ZIP-Datei gefunden."
            exit 1
          fi

          echo "Gefundene ZIP: $ZIP"

          unzip -q "$ZIP" -d source

          echo "ZIP erfolgreich entpackt."

      - name: Find web project
        run: |
          set -e

          INDEX=$(find source -name "index.html" -print -quit)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html nicht gefunden."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Web-Projekt gefunden:"
          echo "$INDEX"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show versions
        run: |
          echo "=== Node ==="
          node --version

          echo "=== npm ==="
          npm --version

          echo "=== Java ==="
          java -version

      - name: Prepare Capacitor project
        run: |
          set -e

          mkdir -p app/web

          INDEX=$(find source -name "index.html" -print -quit)
          ROOT=$(dirname "$INDEX")

          echo "Web root: $ROOT"

          cp -r "$ROOT"/. app/web/

          cd app

          echo "=== Creating npm project ==="
          npm init -y

          echo "=== Installing Capacitor ==="
          npm install \
            @capacitor/core@latest \
            @capacitor/cli@latest \
            @capacitor/android@latest

          echo "=== Capacitor versions ==="
          npx cap --version

          cat > capacitor.config.json <<'EOF'
{
  "appId": "com.godofplayer.ai",
  "appName": "GodOfPlayer AI",
  "webDir": "web"
}
EOF

          echo "=== Adding Android platform ==="
          npx cap add android

          echo "=== Syncing Android project ==="
          npx cap sync android

      - name: Build APK
        run: |
          set -e

          cd app/android

          chmod +x gradlew

          echo "=== Building Debug APK ==="

          ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          set -e

          APK="app/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK wurde nicht erzeugt."
            find app/android -type f -name "*.apk" -print
            exit 1
          fi

          echo "======================================"
          echo "APK ERFOLGREICH ERSTELLT!"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GodOfPlayer-AI-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
