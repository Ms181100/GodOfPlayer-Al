name: Build GodOfPlayer AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Android build ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d source

      - name: Find web project
        run: |
          find source -name "index.html" -print

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Capacitor project
        run: |
          mkdir -p app/web

          INDEX=$(find source -name "index.html" | head -n 1)
          ROOT=$(dirname "$INDEX")

          cp -r "$ROOT"/. app/web/

          cd app

          npm init -y

          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.godofplayer.ai",
            "appName": "GodOfPlayer AI",
